{% extends "base.html" %}

{% block title %}{{ club_name }} — TrueVAR{% endblock %}

{% block content %}
<div
    style="display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: clamp(1.1rem, 4vw, 1.75rem);">
    <div>
        <a href="/settings" class="text-muted"
            style="font-size: 0.9rem; text-decoration: none; display: block; margin-bottom: 0.5rem;">&larr; Back to
            settings</a>
        <h2>{{ club_name }}</h2>
        <p class="text-muted" style="margin-top: 0.4rem;">Your club's athlete roster.</p>
    </div>
    <a href="/athletes/new" class="btn btn-primary">+ Create New Athlete</a>
</div>

<div class="panel" style="padding: clamp(1rem, 4vw, 1.5rem);">
    <input type="text" id="searchInput" placeholder="Search athletes by name..." style="max-width: 360px; width: 100%;">

    <div style="overflow-x: auto; margin-top: 1.25rem;">
        <table
            style="width: 100%; border-collapse: collapse; font-size: clamp(0.85rem, 2vw + 0.5rem, 0.95rem); min-width: 560px;">
            <thead>
                <tr style="text-align: left; border-bottom: 1px solid var(--border);">
                    <th style="padding: 0.6rem 0.5rem; color: var(--text-muted); font-weight: 600;">Name</th>
                    <th style="padding: 0.6rem 0.5rem; color: var(--text-muted); font-weight: 600;">Birth Year</th>
                    <th style="padding: 0.6rem 0.5rem; color: var(--text-muted); font-weight: 600;">Belt</th>
                    <th style="padding: 0.6rem 0.5rem; color: var(--text-muted); font-weight: 600;">Gender</th>
                    <th style="padding: 0.6rem 0.5rem; color: var(--text-muted); font-weight: 600;"></th>
                </tr>
            </thead>
            <tbody id="rosterBody">
                <tr>
                    <td colspan="5" style="padding: 1.5rem 0.5rem; text-align: center; color: var(--text-muted);">
                        Loading roster...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div
        style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border);">
        <span id="pageLabel" class="text-muted mono" style="font-size: 0.85rem;"></span>
        <div style="display: flex; gap: 0.6rem;">
            <button id="prevBtn" class="btn btn-secondary" style="padding: 0.6rem 1.1rem; min-height: 40px;"
                onclick="changePage(-1)">Previous</button>
            <button id="nextBtn" class="btn btn-secondary" style="padding: 0.6rem 1.1rem; min-height: 40px;"
                onclick="changePage(1)">Next</button>
        </div>
    </div>
</div>

<script src="/static/js/truevar-lib.js"></script>
<script>
    const CLUB_ID = {{ club_id | tojson }};
    const PAGE_SIZE = 10;
    let offset = 0;
    let total = 0;
    let searchDebounce = null;

    async function loadRoster() {
        const rosterBody = document.getElementById("rosterBody");
        const search = document.getElementById("searchInput").value.trim();

        rosterBody.innerHTML = `<tr><td colspan="5" style="padding: 1.5rem 0.5rem; text-align: center; color: var(--text-muted);">Loading roster...</td></tr>`;

        const params = new URLSearchParams({ search, limit: PAGE_SIZE, offset });
        const res = await fetch(`/api/clubs/${CLUB_ID}/athletes?${params.toString()}`);

        if (!res.ok) {
            rosterBody.innerHTML = `<tr><td colspan="5" style="padding: 1.5rem 0.5rem; text-align: center; color: var(--red-text);">Couldn't load athletes.</td></tr>`;
            return;
        }

        const data = await res.json();
        total = data.total;

        if (data.athletes.length === 0) {
            rosterBody.innerHTML = `<tr><td colspan="5" style="padding: 1.5rem 0.5rem; text-align: center; color: var(--text-muted);">No athletes found.</td></tr>`;
        } else {
            rosterBody.innerHTML = data.athletes.map(a => `
                <tr style="border-bottom: 1px solid var(--border);">
                    <td style="padding: 0.7rem 0.5rem; font-weight: 600; color: var(--ink);">${escapeHtml(a.displayName)}</td>
                    <td style="padding: 0.7rem 0.5rem;" class="mono">${a.birthYear || "—"}</td>
                    <td style="padding: 0.7rem 0.5rem;" class="mono">${beltLabel(a.rank)}</td>
                    <td style="padding: 0.7rem 0.5rem; text-transform: capitalize;">${escapeHtml(a.gender || "—")}</td>
                    <td style="padding: 0.7rem 0.5rem; text-align: right;">
                        <a href="/athletes/${a.id}/edit" class="btn btn-secondary" style="padding: 0.35rem 0.8rem; font-size: 0.85rem;">Edit</a>
                    </td>
                </tr>
            `).join("");
        }

        const start = total === 0 ? 0 : offset + 1;
        const end = Math.min(offset + PAGE_SIZE, total);
        document.getElementById("pageLabel").textContent = `${start}–${end} of ${total}`;
        document.getElementById("prevBtn").disabled = offset === 0;
        document.getElementById("nextBtn").disabled = offset + PAGE_SIZE >= total;
    }

    function changePage(direction) {
        offset = Math.max(0, offset + direction * PAGE_SIZE);
        loadRoster();
    }

    // Belt label comes from the shared TrueVAR library so it stays in
    // sync with every other page (create_athlete.html, tournament.html,
    // category_manager.html) instead of drifting again like it did
    // before ("10. GUP" here vs "10. Keup" elsewhere for the same rank).
    function beltLabel(rank) {
        return TrueVAR.beltLabel(rank) || "—";
    }

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str ?? "";
        return div.innerHTML;
    }

    document.getElementById("searchInput").addEventListener("input", () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            offset = 0;
            loadRoster();
        }, 300);
    });

    loadRoster();

    // ── Fix: athlete missing from the roster until a manual refresh ──
    // create_athlete.html navigates back here with `history.back()`.
    // Browsers frequently restore that previous page straight from the
    // back/forward cache (bfcache) instead of re-running this script, so
    // the roster fetched on the ORIGINAL page load (before the new/edited
    // athlete existed) just sits there stale. `pageshow` fires on both a
    // normal load and a bfcache restore, and `event.persisted` is true
    // only for the latter — exactly when we need to force a fresh fetch.
    window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
            loadRoster();
        }
    });
</script>
{% endblock %}
