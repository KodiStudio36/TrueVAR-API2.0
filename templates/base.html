<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrueVAR — Tournament Registration{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">

    <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID|default('G-P35R9MG1RR') }}">
    </script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', '{{ GA_MEASUREMENT_ID|default("G-P35R9MG1RR") }}');
    </script>

    <style>
        :root {
            --page-bg: #f2f3f5;
            --surface: #ffffff;
            --ink: #16181d;
            --text: #262a31;
            --text-muted: #52565f;
            --border: #d6d9de;
            --border-strong: #babec6;
            --navy: #1c3d6b;
            --navy-dark: #142c4d;
            --red-text: #8a1f26;
            --red-bg: #fbeaea;
            --blue-text: #1c3d6b;
            --blue-bg: #eaf0f8;
            --focus: #1c3d6b;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .display {
            font-family: 'Source Serif 4', Georgia, serif;
            font-weight: 600;
            line-height: 1.2;
            color: var(--ink);
        }

        h2 {
            font-size: clamp(1.5rem, 4.5vw + 0.5rem, 2.1rem);
        }

        h3 {
            font-size: clamp(1.15rem, 2.8vw + 0.5rem, 1.4rem);
            margin-bottom: 0;
        }

        p {
            color: var(--text);
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .text-muted {
            color: var(--text-muted);
        }

        a {
            color: var(--navy);
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        /* ── NAVBAR ─────────────────────────────────────────── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .7rem 1.5rem;
            gap: 0.75rem;
            background-color: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            transform: translateY(0);
            transition: transform 0.25s ease;
            will-change: transform;
        }

        /* Applied via JS while scrolling down past the reveal threshold */
        .navbar.navbar-hidden {
            transform: translateY(-100%);
        }

        .navbar::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 2px;
            background: linear-gradient(90deg, var(--navy) 0%, rgba(28, 61, 107, 0) 55%);
            opacity: 0.55;
            pointer-events: none;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        .brand-logo:hover {
            opacity: 0.85;
        }

        .brand-logo img {
            height: clamp(28px, 3.2vw + 16px, 36px);
            width: auto;
            display: block;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: clamp(0.75rem, 2vw, 1.5rem);
        }

        /* Whole chip is now a link into Settings */
        .profile-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--text);
            padding: 0.35rem 0.6rem 0.35rem 0.4rem;
            border-radius: 999px;
            border: 1px solid transparent;
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .profile-link:hover,
        .profile-link:focus-visible {
            background-color: var(--page-bg);
            border-color: var(--border);
        }

        .profile-link:hover .user-avatar {
            box-shadow: 0 0 0 3px var(--blue-bg);
        }

        .user-chip-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .user-chip-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--ink);
        }

        .user-chip-sub {
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-strong);
            transition: box-shadow 0.15s ease;
        }

        .profile-chevron {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .btn-login {
            background-color: var(--navy);
            color: #ffffff;
            padding: 0.6rem 1.4rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-block;
            transition: background-color 0.15s ease;
        }

        .btn-login:hover {
            background-color: var(--navy-dark);
        }

        .btn-logout {
            color: var(--text-muted);
            text-decoration: underline;
            text-underline-offset: 2px;
            font-size: 0.92rem;
        }

        .btn-logout:hover {
            color: var(--ink);
        }

        /* ── SHARED BUTTONS ─────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: clamp(0.9rem, 1.5vw + 0.55rem, 0.98rem);
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: var(--radius);
            padding: clamp(0.7rem, 2vw, 0.85rem) clamp(1.1rem, 4vw, 1.6rem);
            min-height: 46px;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-primary {
            background: var(--navy);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--navy-dark);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink);
            border-color: var(--border-strong);
        }

        .btn-secondary:hover {
            background: var(--page-bg);
        }

        /* ── CARD / TAG PRIMITIVES ─────────────────────────── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 3px rgba(16, 20, 30, 0.06);
        }

        .tag {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 5px;
            line-height: 1.3;
        }

        .tag-navy {
            background: var(--blue-bg);
            color: var(--blue-text);
        }

        .tag-red {
            background: var(--red-bg);
            color: var(--red-text);
        }

        .tag-neutral {
            background: var(--page-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ── FORM PRIMITIVES ────────────────────────────────── */
        label.field-label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.4rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--surface);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--ink);
            min-height: 46px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(28, 61, 107, 0.18);
        }

        .hidden {
            display: none !important;
        }

        /* Reusable 2-up form row — collapses to a single column on
           narrow screens instead of squeezing two fields side by side. */
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .container {
            flex: 1;
            max-width: 1080px;
            width: 100%;
            margin: clamp(1rem, 4vw, 2.5rem) auto;
            padding: 0 clamp(0.85rem, 3vw, 1.5rem);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: clamp(0.85rem, 2.5vw, 1.5rem);
        }

        /* ── RESPONSIVE BREAKPOINTS ─────────────────────────── */
        @media (max-width: 768px) {
            .form-grid-2 {
                grid-template-columns: 1fr;
                gap: 0.85rem;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0.85rem 1rem;
            }

            .user-chip-text {
                display: none;
            }

            body {
                font-size: 16px;
                line-height: 1.55;
            }

            h2 {
                font-size: 1.6rem;
            }

            h3 {
                font-size: 1.2rem;
            }

            .panel {
                border-radius: 6px;
            }

            .btn {
                min-height: 44px;
            }
        }

        @media (max-width: 420px) {
            body {
                font-size: 15px;
            }

            h2 {
                font-size: 1.4rem;
            }

            .brand-logo {
                font-size: 1.1rem;
            }

            .container {
                padding: 0 0.75rem;
                margin: 0.75rem auto;
            }

            .btn {
                padding: 0.65rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* Respect reduced-motion preferences — no slide animation, navbar
           just stays put regardless of what the scroll script decides. */
        @media (prefers-reduced-motion: reduce) {
            .navbar {
                transition: none;
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar" id="navbar">
        <a href="/" class="brand-logo">
            <img src="/static/assets/logos/truevar_logo.png" style="padding: 4px 0px;" alt="TrueVAR">
        </a>

        <div class="nav-right">
            {% if user %}
            <a href="/settings" class="profile-link" aria-label="Open account settings">
                <img src="{{ user.photoUrl }}" alt="" class="user-avatar" referrerpolicy="no-referrer">
                <span class="user-chip-text">
                    <span class="user-chip-name">{{ user.firstname }}</span>
                    <span class="user-chip-sub">Settings</span>
                </span>
                <svg class="profile-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>
            {% else %}
            <a href="/login" class="btn-login">Log in</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Hide the navbar on scroll-down, reveal it on scroll-up.
        // - Ignored below a small threshold so it doesn't flicker while
        //   the page is basically still at the top.
        // - Ignored during momentum/bounce scroll on iOS (negative or
        //   past-bottom scrollY) so it doesn't twitch during the rubber-
        //   band overscroll effect.
        // - Always reveals when the user scrolls back up, even a little,
        //   which feels more responsive than waiting for a big swipe.
        (function () {
            var navbar = document.getElementById("navbar");
            if (!navbar) return;

            var lastScrollY = window.scrollY;
            var isHidden = false;
            var ticking = false;
            var revealThreshold = navbar.offsetHeight; // don't hide until we've scrolled past the navbar's own height
            var minScrollDelta = 4; // ignore tiny jitters

            function onScroll() {
                var currentScrollY = Math.max(window.scrollY, 0);
                var delta = currentScrollY - lastScrollY;

                if (Math.abs(delta) < minScrollDelta) {
                    ticking = false;
                    return;
                }

                if (currentScrollY <= revealThreshold) {
                    // Always show near the top of the page.
                    if (isHidden) {
                        navbar.classList.remove("navbar-hidden");
                        isHidden = false;
                    }
                } else if (delta > 0) {
                    // Scrolling down — hide.
                    if (!isHidden) {
                        navbar.classList.add("navbar-hidden");
                        isHidden = true;
                    }
                } else {
                    // Scrolling up — show.
                    if (isHidden) {
                        navbar.classList.remove("navbar-hidden");
                        isHidden = false;
                    }
                }

                lastScrollY = currentScrollY;
                ticking = false;
            }

            window.addEventListener("scroll", function () {
                if (!ticking) {
                    window.requestAnimationFrame(onScroll);
                    ticking = true;
                }
            }, { passive: true });
        })();
    </script>

</body>

</html>
