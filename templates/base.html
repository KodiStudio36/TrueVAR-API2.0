<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrueVAR — Tournament Registration{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --page-bg: #f2f3f5;
            --surface: #ffffff;
            --ink: #16181d;
            --text: #262a31;
            --text-muted: #52565f;
            --border: #d6d9de;
            --border-strong: #babec6;
            --navy: #1c3d6b;
            --navy-dark: #142c4d;
            --red-text: #8a1f26;
            --red-bg: #fbeaea;
            --blue-text: #1c3d6b;
            --blue-bg: #eaf0f8;
            --focus: #1c3d6b;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .display {
            font-family: 'Source Serif 4', Georgia, serif;
            font-weight: 600;
            line-height: 1.2;
            color: var(--ink);
        }

        h2 {
            font-size: 2.1rem;
        }

        h3 {
            font-size: 1.4rem;
            margin-bottom: 0;
        }

        p {
            color: var(--text);
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .text-muted {
            color: var(--text-muted);
        }

        a {
            color: var(--navy);
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        /* ── NAVBAR ─────────────────────────────────────────── */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 2rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            font-family: 'Source Serif 4', serif;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-strong);
        }

        .btn-login {
            background-color: var(--navy);
            color: #ffffff;
            padding: 0.6rem 1.4rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-block;
            transition: background-color 0.15s ease;
        }

        .btn-login:hover {
            background-color: var(--navy-dark);
        }

        .btn-logout {
            color: var(--text-muted);
            text-decoration: underline;
            text-underline-offset: 2px;
            font-size: 0.92rem;
        }

        .btn-logout:hover {
            color: var(--ink);
        }

        /* ── SHARED BUTTONS ─────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.98rem;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: var(--radius);
            padding: 0.85rem 1.6rem;
            min-height: 48px;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-primary {
            background: var(--navy);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--navy-dark);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink);
            border-color: var(--border-strong);
        }

        .btn-secondary:hover {
            background: var(--page-bg);
        }

        /* ── CARD / TAG PRIMITIVES ─────────────────────────── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 3px rgba(16, 20, 30, 0.06);
        }

        .tag {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 5px;
            line-height: 1.3;
        }

        .tag-navy {
            background: var(--blue-bg);
            color: var(--blue-text);
        }

        .tag-red {
            background: var(--red-bg);
            color: var(--red-text);
        }

        .tag-neutral {
            background: var(--page-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ── FORM PRIMITIVES ────────────────────────────────── */
        label.field-label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.4rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--surface);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--ink);
            min-height: 46px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(28, 61, 107, 0.18);
        }

        .hidden {
            display: none !important;
        }

        .container {
            flex: 1;
            max-width: 1080px;
            width: 100%;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 1rem;
            }

            body {
                font-size: 16px;
            }

            h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/" class="brand-logo">TrueVAR</a>

        <div class="nav-right">
            {% if user %}
            <div class="user-chip">
                <span>{{ user.firstname }}</span>
                <img src="{{ user.photoUrl }}" alt="" class="user-avatar" referrerpolicy="no-referrer">
            </div>
            <a href="/logout" class="btn-logout">Log out</a>
            {% else %}
            <a href="/login" class="btn-login">Log in</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

</body>

</html>
