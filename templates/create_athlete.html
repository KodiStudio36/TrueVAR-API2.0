{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: clamp(1.25rem, 5vw, 2rem) auto;">
    <a href="javascript:history.back()" class="text-muted" style="font-size: 0.95rem; text-decoration: none;">&larr;
        Back to tournament</a>

    <div class="panel" style="padding: clamp(1.25rem, 5vw, 2.5rem); margin-top: 1rem;">
        <h2 id="pageTitle" style="margin-bottom: 0.5rem;">Create Athlete</h2>
        <p id="pageSubtitle" class="text-muted" style="margin-bottom: clamp(1.25rem, 4vw, 2rem);">Add a new athlete to
            your club roster.
        </p>

        <form id="createAthleteForm" onsubmit="submitAthlete(event)" data-club-country="{{ club_country }}"
            data-club-sport="{{ club_sport }}" data-athlete-id="{{ athlete_id or '' }}"
            style="display: flex; flex-direction: column; gap: 1.1rem;">

            <div class="form-grid-2">
                <div>
                    <label class="field-label" for="a_firstname">First Name</label>
                    <input type="text" id="a_firstname" required>
                </div>
                <div>
                    <label class="field-label" for="a_lastname">Last Name</label>
                    <input type="text" id="a_lastname" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div>
                    <label class="field-label" for="a_gender">Gender</label>
                    <select id="a_gender" required>
                        <option value="" disabled selected>Select gender...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="a_birthday">Birthday</label>
                    <input type="date" id="a_birthday" required>
                </div>
            </div>

            <div>
                <label class="field-label" for="a_country">Country</label>
                <select id="a_country" required
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <option value="" disabled selected>Select country...</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 0.25rem 0;">

            <div>
                <label class="field-label" for="a_sport">Primary Sport</label>
                <select id="a_sport" onchange="toggleSportSpecifics()" required
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <option value="" disabled selected>Select sport...</option>
                    <option value="taekwondo">Taekwondo</option>
                    <option value="boxing">Boxing / Box</option>
                </select>
                <p id="sportLockedNote" class="text-muted hidden" style="font-size: 0.8rem; margin-top: 0.35rem;">
                    Fixed to your club's configured sport while editing.
                </p>
            </div>

            <div>
                <label class="field-label" for="a_association_id">
                    Association ID <span class="text-muted" style="font-weight: 400;">(optional)</span>
                </label>
                <input type="text" id="a_association_id" placeholder="e.g. national federation ID for this sport">
            </div>

            <!-- Para classification -->
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <input type="checkbox" id="a_is_para" onchange="toggleParaCategory()"
                    style="width: 1.1rem; height: 1.1rem;">
                <label class="field-label" for="a_is_para" style="margin: 0;">This athlete competes in Para
                    categories</label>
            </div>

            <div id="para_category_wrap" class="hidden">
                <label class="field-label" for="a_para_category">Para Category</label>
                <select id="a_para_category"
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <option value="" disabled selected>Select para category...</option>
                    <!-- Populated from PARA_CATEGORIES in JS below -->
                </select>
            </div>

            <!-- Taekwondo Specifics -->
            <div id="tkd_specifics" class="hidden"
                style="background: var(--bg-alt); padding: clamp(0.85rem, 3vw, 1rem); border-radius: 6px; border: 1px solid var(--border);">
                <label class="field-label" for="tkd_rank">Taekwondo Rank</label>
                <select id="tkd_rank"
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <!-- Populated from TrueVAR.populateBeltSelect() in JS below -->
                </select>
            </div>

            <!-- Boxing Specifics (Placeholder for future fields) -->
            <div id="boxing_specifics" class="hidden"
                style="background: var(--bg-alt); padding: clamp(0.85rem, 3vw, 1rem); border-radius: 6px; border: 1px solid var(--border);">
                <p class="text-muted" style="font-size: 0.85rem; margin: 0;">Boxing specific fields will appear here.
                </p>
            </div>

            <div style="margin-top: 0.75rem;">
                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Create
                    Athlete</button>
            </div>

            <p id="formMsg" class="hidden"
                style="border-radius: 6px; padding: 0.85rem 1rem; font-size: 0.95rem; margin: 0; text-align: center;">
            </p>
        </form>
    </div>
</div>

<script src="/static/js/truevar-lib.js"></script>
<script>
    // Mirrors backend PARA_CATEGORIES in routers_athletes.py — keep in sync.
    const PARA_CATEGORIES = [
        "P11", "P12",
        "P21", "P22", "P23",
        "P31", "P32", "P33", "P34", "P35",
        "P41", "P42", "P43", "P44", "P45",
        "P51", "P52", "P53",
        "P60",
        "P72",
    ];

    const form = document.getElementById("createAthleteForm");
    const ATHLETE_ID = (form.getAttribute("data-athlete-id") || "").trim();
    const IS_EDIT = ATHLETE_ID.length > 0;

    document.addEventListener("DOMContentLoaded", () => {
        populateCountries();
        populateBelts();
        populateParaCategories();
        setupModeChrome();

        if (IS_EDIT) {
            loadAthleteForEdit();
        } else {
            preselectCountryFromClub();
            preselectSportFromClub();
        }
    });

    function setupModeChrome() {
        if (!IS_EDIT) return;
        document.getElementById("pageTitle").textContent = "Edit Athlete";
        document.getElementById("pageSubtitle").textContent = "Update this athlete's details.";
        document.getElementById("submitBtn").textContent = "Save Changes";
        // The backend always files the athlete under the admin's own club's
        // configured sport regardless of what's selected here (see
        // create_athlete_endpoint / update_athlete_endpoint), so editing the
        // sport mid-edit would be misleading — lock it once we're in edit mode.
        document.getElementById("a_sport").disabled = true;
        document.getElementById("sportLockedNote").classList.remove("hidden");
    }

    function populateCountries() {
        // The <option value="" disabled selected>Select country...</option>
        // placeholder is already in the markup above, so skip the
        // library's own blank option to avoid a duplicate.
        TrueVAR.populateCountrySelect(document.getElementById("a_country"), { includeBlank: false });
    }

    function populateBelts() {
        TrueVAR.populateBeltSelect(document.getElementById("tkd_rank"));
    }

    function populateParaCategories() {
        const select = document.getElementById("a_para_category");
        PARA_CATEGORIES.forEach(code => {
            const opt = document.createElement("option");
            opt.value = code;
            opt.textContent = `Para ${code}`;
            select.appendChild(opt);
        });
    }

    function preselectCountryFromClub() {
        const clubCountry = (form.getAttribute("data-club-country") || "").toUpperCase();
        if (clubCountry) {
            document.getElementById("a_country").value = clubCountry;
        }
    }

    function preselectSportFromClub() {
        const select = document.getElementById("a_sport");
        let clubSport = (form.getAttribute("data-club-sport") || "").toLowerCase();

        // Handle naming variations between backend ("box") and frontend options ("boxing")
        if (clubSport === "box") clubSport = "boxing";

        if (clubSport && (clubSport === "taekwondo" || clubSport === "boxing")) {
            select.value = clubSport;
            toggleSportSpecifics();
        }
    }

    function toggleSportSpecifics() {
        const sport = document.getElementById("a_sport").value;
        const tkdDiv = document.getElementById("tkd_specifics");
        const boxDiv = document.getElementById("boxing_specifics");

        tkdDiv.classList.add("hidden");
        boxDiv.classList.add("hidden");

        if (sport === "taekwondo") tkdDiv.classList.remove("hidden");
        if (sport === "boxing") boxDiv.classList.remove("hidden");
    }

    function toggleParaCategory() {
        const checked = document.getElementById("a_is_para").checked;
        const wrap = document.getElementById("para_category_wrap");
        const select = document.getElementById("a_para_category");

        wrap.classList.toggle("hidden", !checked);
        select.required = checked;
        if (!checked) {
            select.value = "";
        }
    }

    async function loadAthleteForEdit() {
        const msg = document.getElementById("formMsg");
        try {
            const res = await fetch(`/api/athletes/${ATHLETE_ID}`);
            if (!res.ok) {
                throw new Error("Couldn't load this athlete.");
            }
            const a = await res.json();

            document.getElementById("a_firstname").value = a.firstName || "";
            document.getElementById("a_lastname").value = a.lastName || "";
            if (a.gender) document.getElementById("a_gender").value = a.gender;
            if (a.birthday) document.getElementById("a_birthday").value = a.birthday;
            if (a.country) document.getElementById("a_country").value = a.country;
            if (a.sport) {
                document.getElementById("a_sport").value = a.sport;
                toggleSportSpecifics();
            }
            if (a.associationId) document.getElementById("a_association_id").value = a.associationId;
            if (a.rank !== undefined && a.rank !== null) {
                document.getElementById("tkd_rank").value = String(a.rank);
            }

            document.getElementById("a_is_para").checked = !!a.isPara;
            toggleParaCategory();
            if (a.isPara && a.paraCategory) {
                document.getElementById("a_para_category").value = a.paraCategory;
            }
        } catch (err) {
            msg.textContent = err.message || "Couldn't load this athlete.";
            msg.style.background = "#fee2e2";
            msg.style.color = "#b91c1c";
            msg.classList.remove("hidden");
        }
    }

    async function submitAthlete(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const msg = document.getElementById("formMsg");

        submitBtn.disabled = true;
        submitBtn.textContent = IS_EDIT ? "Saving..." : "Creating...";
        msg.classList.add("hidden");

        const sport = document.getElementById("a_sport").value;
        let rankValue = 0;

        if (sport === "taekwondo") {
            rankValue = parseInt(document.getElementById("tkd_rank").value, 10);
        }

        const associationId = document.getElementById("a_association_id").value.trim();
        const isPara = document.getElementById("a_is_para").checked;
        const paraCategory = document.getElementById("a_para_category").value;

        if (isPara && !paraCategory) {
            msg.textContent = "Please select a para category.";
            msg.style.background = "#fee2e2";
            msg.style.color = "#b91c1c";
            msg.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = IS_EDIT ? "Save Changes" : "Create Athlete";
            return;
        }

        const payload = {
            firstName: document.getElementById("a_firstname").value.trim(),
            lastName: document.getElementById("a_lastname").value.trim(),
            gender: document.getElementById("a_gender").value,
            birthday: document.getElementById("a_birthday").value,
            country: document.getElementById("a_country").value,
            sport: sport,
            rank: rankValue,
            isPara: isPara,
        };

        if (isPara) {
            payload.paraCategory = paraCategory;
        }

        // Optional, sport-scoped on the backend — only send it if filled in,
        // rather than sending an empty string.
        if (associationId) {
            payload.associationId = associationId;
        }

        try {
            const res = await fetch(IS_EDIT ? `/api/athletes/${ATHLETE_ID}` : "/api/athletes", {
                method: IS_EDIT ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const body = await res.json();
                throw new Error(body.detail || `Failed to ${IS_EDIT ? "update" : "create"} athlete`);
            }

            msg.textContent = IS_EDIT
                ? "Athlete updated successfully!"
                : "Athlete successfully added to your club roster!";
            msg.style.background = "var(--blue-bg)";
            msg.style.color = "var(--blue-text)";
            msg.classList.remove("hidden");

            setTimeout(() => {
                history.back();
            }, 1200);

        } catch (err) {
            msg.textContent = err.message;
            msg.style.background = "#fee2e2";
            msg.style.color = "#b91c1c";
            msg.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = IS_EDIT ? "Save Changes" : "Create Athlete";
        }
    }
</script>
{% endblock %}
