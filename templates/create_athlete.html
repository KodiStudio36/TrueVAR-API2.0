{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: clamp(1.25rem, 5vw, 2rem) auto;">
    <a href="javascript:history.back()" class="text-muted" style="font-size: 0.95rem; text-decoration: none;">&larr;
        Back to tournament</a>

    <div class="panel" style="padding: clamp(1.25rem, 5vw, 2.5rem); margin-top: 1rem;">
        <h2 style="margin-bottom: 0.5rem;">Create Athlete</h2>
        <p class="text-muted" style="margin-bottom: clamp(1.25rem, 4vw, 2rem);">Add a new athlete to your club roster.
        </p>

        <form id="createAthleteForm" onsubmit="submitAthlete(event)" data-club-country="{{ club_country }}"
            data-club-sport="{{ club_sport }}" style="display: flex; flex-direction: column; gap: 1.1rem;">

            <div class="form-grid-2">
                <div>
                    <label class="field-label" for="a_firstname">First Name</label>
                    <input type="text" id="a_firstname" required>
                </div>
                <div>
                    <label class="field-label" for="a_lastname">Last Name</label>
                    <input type="text" id="a_lastname" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div>
                    <label class="field-label" for="a_gender">Gender</label>
                    <select id="a_gender" required>
                        <option value="" disabled selected>Select gender...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="a_birthday">Birthday</label>
                    <input type="date" id="a_birthday" required>
                </div>
            </div>

            <div>
                <label class="field-label" for="a_country">Country</label>
                <select id="a_country" required
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <option value="" disabled selected>Select country...</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 0.25rem 0;">

            <div>
                <label class="field-label" for="a_sport">Primary Sport</label>
                <select id="a_sport" onchange="toggleSportSpecifics()" required
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <option value="" disabled selected>Select sport...</option>
                    <option value="taekwondo">Taekwondo</option>
                    <option value="boxing">Boxing / Box</option>
                </select>
            </div>

            <div>
                <label class="field-label" for="a_association_id">
                    Association ID <span class="text-muted" style="font-weight: 400;">(optional)</span>
                </label>
                <input type="text" id="a_association_id" placeholder="e.g. national federation ID for this sport">
            </div>

            <!-- Taekwondo Specifics -->
            <div id="tkd_specifics" class="hidden"
                style="background: var(--bg-alt); padding: clamp(0.85rem, 3vw, 1rem); border-radius: 6px; border: 1px solid var(--border);">
                <label class="field-label" for="tkd_rank">Taekwondo Rank</label>
                <select id="tkd_rank"
                    style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                    <optgroup label="Color Belts (Keup)">
                        <option value="0">10. Keup (White)</option>
                        <option value="1">9. Keup (White-Yellow)</option>
                        <option value="2">8. Keup (Yellow)</option>
                        <option value="3">7. Keup (Yellow-Green)</option>
                        <option value="4">6. Keup (Green)</option>
                        <option value="5">5. Keup (Green-Blue)</option>
                        <option value="6">4. Keup (Blue)</option>
                        <option value="7">3. Keup (Blue-Red)</option>
                        <option value="8">2. Keup (Red)</option>
                        <option value="9">1. Keup (Red-Black)</option>
                    </optgroup>
                    <optgroup label="Black Belts (Dan/Poom)">
                        <option value="10">1. Dan</option>
                        <option value="11">2. Dan</option>
                        <option value="12">3. Dan</option>
                        <option value="13">4. Dan</option>
                        <option value="14">5. Dan</option>
                        <option value="15">6. Dan</option>
                        <option value="16">7. Dan</option>
                        <option value="17">8. Dan</option>
                        <option value="18">9. Dan</option>
                    </optgroup>
                </select>
            </div>

            <!-- Boxing Specifics (Placeholder for future fields) -->
            <div id="boxing_specifics" class="hidden"
                style="background: var(--bg-alt); padding: clamp(0.85rem, 3vw, 1rem); border-radius: 6px; border: 1px solid var(--border);">
                <p class="text-muted" style="font-size: 0.85rem; margin: 0;">Boxing specific fields will appear here.
                </p>
            </div>

            <div style="margin-top: 0.75rem;">
                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Create
                    Athlete</button>
            </div>

            <p id="formMsg" class="hidden"
                style="border-radius: 6px; padding: 0.85rem 1rem; font-size: 0.95rem; margin: 0; text-align: center;">
            </p>
        </form>
    </div>
</div>

<script>
    // Complete ISO 3166-1 alpha-3 countries list sorted alphanumerically by country name
    const ISO_COUNTRIES = [
        { code: "AFG", name: "Afghanistan" }, { code: "ALB", name: "Albania" },
        { code: "DZA", name: "Algeria" }, { code: "AND", name: "Andorra" },
        { code: "AGO", name: "Angola" }, { code: "ARG", name: "Argentina" },
        { code: "ARM", name: "Armenia" }, { code: "AUS", name: "Australia" },
        { code: "AUT", name: "Austria" }, { code: "AZE", name: "Azerbaijan" },
        { code: "BHR", name: "Bahrain" }, { code: "BGD", name: "Bangladesh" },
        { code: "BLR", name: "Belarus" }, { code: "BEL", name: "Belgium" },
        { code: "BIH", name: "Bosnia and Herzegovina" }, { code: "BRA", name: "Brazil" },
        { code: "BGR", name: "Bulgaria" }, { code: "CAN", name: "Canada" },
        { code: "CHL", name: "Chile" }, { code: "CHN", name: "China" },
        { code: "COL", name: "Colombia" }, { code: "CRO", name: "Croatia" },
        { code: "CUB", name: "Cuba" }, { code: "CYP", name: "Cyprus" },
        { code: "CZE", name: "Czech Republic" }, { code: "DNK", name: "Denmark" },
        { code: "EGY", name: "Egypt" }, { code: "EST", name: "Estonia" },
        { code: "FIN", name: "Finland" }, { code: "FRA", name: "France" },
        { code: "GEO", name: "Georgia" }, { code: "DEU", name: "Germany" },
        { code: "GRC", name: "Greece" }, { code: "HUN", name: "Hungary" },
        { code: "ISL", name: "Iceland" }, { code: "IND", name: "India" },
        { code: "IRN", name: "Iran" }, { code: "IRL", name: "Ireland" },
        { code: "ISR", name: "Israel" }, { code: "ITA", name: "Italy" },
        { code: "JPN", name: "Japan" }, { code: "KAZ", name: "Kazakhstan" },
        { code: "KOR", name: "Korea (South)" }, { code: "LVA", name: "Latvia" },
        { code: "LTU", name: "Lithuania" }, { code: "LUX", name: "Luxembourg" },
        { code: "MEX", name: "Mexico" }, { code: "MDA", name: "Moldova" },
        { code: "MNE", name: "Montenegro" }, { code: "NLD", name: "Netherlands" },
        { code: "NZL", name: "New Zealand" }, { code: "MKD", name: "North Macedonia" },
        { code: "NOR", name: "Norway" }, { code: "POL", name: "Poland" },
        { code: "PRT", name: "Portugal" }, { code: "ROU", name: "Romania" },
        { code: "SRB", name: "Serbia" }, { code: "SVK", name: "Slovakia" },
        { code: "SVN", name: "Slovenia" }, { code: "ESP", name: "Spain" },
        { code: "SWE", name: "Sweden" }, { code: "CHE", name: "Switzerland" },
        { code: "TUR", name: "Turkey" }, { code: "UKR", name: "Ukraine" },
        { code: "GBR", name: "United Kingdom" }, { code: "USA", name: "United States" }
    ].sort((a, b) => a.name.localeCompare(b.name));

    document.addEventListener("DOMContentLoaded", () => {
        populateAndPreselectCountries();
        preselectSport();
    });

    function populateAndPreselectCountries() {
        const select = document.getElementById("a_country");
        const form = document.getElementById("createAthleteForm");
        const clubCountry = (form.getAttribute("data-club-country") || "").toUpperCase();

        ISO_COUNTRIES.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.code;
            opt.textContent = `${c.name} (${c.code})`;
            select.appendChild(opt);
        });

        if (clubCountry) {
            select.value = clubCountry;
        }
    }

    function preselectSport() {
        const select = document.getElementById("a_sport");
        const form = document.getElementById("createAthleteForm");
        let clubSport = (form.getAttribute("data-club-sport") || "").toLowerCase();

        // Handle naming variations between backend ("box") and frontend options ("boxing")
        if (clubSport === "box") clubSport = "boxing";

        if (clubSport && (clubSport === "taekwondo" || clubSport === "boxing")) {
            select.value = clubSport;
            toggleSportSpecifics();
        }
    }

    function toggleSportSpecifics() {
        const sport = document.getElementById("a_sport").value;
        const tkdDiv = document.getElementById("tkd_specifics");
        const boxDiv = document.getElementById("boxing_specifics");

        tkdDiv.classList.add("hidden");
        boxDiv.classList.add("hidden");

        if (sport === "taekwondo") tkdDiv.classList.remove("hidden");
        if (sport === "boxing") boxDiv.classList.remove("hidden");
    }

    async function submitAthlete(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const msg = document.getElementById("formMsg");

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating...";
        msg.classList.add("hidden");

        const sport = document.getElementById("a_sport").value;
        let rankValue = 0;

        if (sport === "taekwondo") {
            rankValue = parseInt(document.getElementById("tkd_rank").value, 10);
        }

        const associationId = document.getElementById("a_association_id").value.trim();

        const payload = {
            firstName: document.getElementById("a_firstname").value.trim(),
            lastName: document.getElementById("a_lastname").value.trim(),
            gender: document.getElementById("a_gender").value,
            birthday: document.getElementById("a_birthday").value,
            country: document.getElementById("a_country").value,
            sport: sport,
            rank: rankValue
        };

        // Optional, sport-scoped on the backend — only send it if filled in,
        // rather than sending an empty string.
        if (associationId) {
            payload.associationId = associationId;
        }

        try {
            const res = await fetch("/api/athletes", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const body = await res.json();
                throw new Error(body.detail || "Failed to create athlete");
            }

            msg.textContent = "Athlete successfully added to your club roster!";
            msg.style.background = "var(--blue-bg)";
            msg.style.color = "var(--blue-text)";
            msg.classList.remove("hidden");

            setTimeout(() => {
                history.back();
            }, 1200);

        } catch (err) {
            msg.textContent = err.message;
            msg.style.background = "#fee2e2";
            msg.style.color = "#b91c1c";
            msg.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Athlete";
        }
    }
</script>
{% endblock %}
